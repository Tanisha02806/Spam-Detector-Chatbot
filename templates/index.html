<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spam Detector Chatbot</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f1f3f6; color: #1d2330;
    display: flex; justify-content: center; padding: 24px 12px;
  }
  .app {
    width: 100%; max-width: 640px; background: #fff; border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08); display: flex; flex-direction: column;
    height: calc(100vh - 48px); max-height: 800px; overflow: hidden;
  }
  header { padding: 16px 20px; border-bottom: 1px solid #e6e9ef; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #6b7385; }

  #chat { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 88%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; font-size: 15px; }
  .user { align-self: flex-end; background: #2f5bea; color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: #f1f3f6; border-bottom-left-radius: 4px; width: 88%; }

  .verdict { font-weight: 700; font-size: 16px; margin-bottom: 8px; }
  .verdict.spam { color: #d93636; }
  .verdict.ham  { color: #1f9d55; }

  .bar { display: flex; height: 22px; border-radius: 11px; overflow: hidden; background: #dde1e8; font-size: 12px; color: #fff; }
  .bar .s { background: #d93636; display: flex; align-items: center; justify-content: center; transition: width .5s; }
  .bar .h { background: #1f9d55; display: flex; align-items: center; justify-content: center; transition: width .5s; }
  .bar-labels { display: flex; justify-content: space-between; font-size: 12px; color: #6b7385; margin: 4px 2px 10px; }

  .words-title { font-size: 12px; color: #6b7385; margin-bottom: 6px; }
  .chip { display: inline-block; padding: 3px 9px; margin: 0 4px 6px 0; border-radius: 999px; font-size: 13px; border: 1px solid transparent; }
  .legend { font-size: 11px; color: #6b7385; margin-top: 4px; }

  form { display: flex; gap: 8px; padding: 14px 16px; border-top: 1px solid #e6e9ef; }
  input[type=text] { flex: 1; padding: 12px 14px; border: 1px solid #cfd5df; border-radius: 10px; font-size: 15px; outline: none; }
  input[type=text]:focus { border-color: #2f5bea; }
  button { padding: 0 20px; border: 0; border-radius: 10px; background: #2f5bea; color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Spam Detector</h1>
    <p>Type a message and see how the Naive Bayes model decides.</p>
  </header>

  <div id="chat">
    <div class="bubble bot">Hi! Send me any message and I'll tell you if it looks like spam, and why.</div>
  </div>

  <form id="form">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off" autofocus>
    <button type="submit" id="send">Send</button>
  </form>
</div>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addBubble(cls) {
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// Colour a word chip: red = spam evidence, green = not-spam evidence, grey = unknown
function chipStyle(token) {
  if (!token.known) return { bg: "#e9ecf1", fg: "#6b7385", border: "#cfd5df" };
  const strength = Math.min(Math.abs(token.evidence) / 2.5, 1);   // 0..1
  const alpha = 0.15 + 0.6 * strength;
  if (token.evidence >= 0) return { bg: `rgba(217,54,54,${alpha})`, fg: "#7a1010", border: "transparent" };
  return { bg: `rgba(31,157,85,${alpha})`, fg: "#0d5a2c", border: "transparent" };
}

function renderResult(div, r) {
  const isSpam = r.prediction === "Spam";
  const spamPct = Math.round(r.spam_prob * 100);
  const hamPct = 100 - spamPct;

  const verdict = document.createElement("div");
  verdict.className = "verdict " + (isSpam ? "spam" : "ham");
  verdict.textContent = isSpam ? "🚨 Spam" : "✅ Not Spam";
  div.appendChild(verdict);

  const bar = document.createElement("div");
  bar.className = "bar";
  bar.innerHTML = `<div class="s" style="width:${spamPct}%">${spamPct >= 12 ? spamPct + "%" : ""}</div>` +
                  `<div class="h" style="width:${hamPct}%">${hamPct >= 12 ? hamPct + "%" : ""}</div>`;
  div.appendChild(bar);

  const labels = document.createElement("div");
  labels.className = "bar-labels";
  labels.innerHTML = `<span>Spam ${r.spam_prob.toFixed(3)}</span><span>Not Spam ${r.ham_prob.toFixed(3)}</span>`;
  div.appendChild(labels);

  const title = document.createElement("div");
  title.className = "words-title";
  title.textContent = "How each word influenced the result:";
  div.appendChild(title);

  r.tokens.forEach(t => {
    const s = chipStyle(t);
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.style.background = s.bg;
    chip.style.color = s.fg;
    chip.style.borderColor = s.border;
    chip.textContent = t.known ? `${t.word} (${t.evidence >= 0 ? "+" : ""}${t.evidence.toFixed(2)})` : `${t.word} (unknown)`;
    div.appendChild(chip);
  });

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.textContent = "Red = pushes toward Spam · Green = pushes toward Not Spam · Grey = word not in training data (ignored)";
  div.appendChild(legend);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addBubble("user").textContent = text;
  input.value = "";
  sendBtn.disabled = true;

  const botDiv = addBubble("bot");
  botDiv.textContent = "Analyzing...";

  try {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    botDiv.textContent = "";
    if (!res.ok) {
      botDiv.textContent = data.error || "Something went wrong.";
    } else {
      renderResult(botDiv, data);
    }
  } catch (err) {
    botDiv.textContent = "Could not reach the server. Is Flask running?";
  }

  sendBtn.disabled = false;
  input.focus();
  chat.scrollTop = chat.scrollHeight;
});
</script>
</body>
</html>
